[package]
name = "knossos-app"
version = "0.2.0"
edition = "2021"
description = "Knossos desktop: the Field operator surface on the Rust harness, for any model, any project, any agent."
license = "MIT"
publish = false

[[bin]]
name = "knossos-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
knossos = { path = "../knossos-rs" }
serde_json = "1"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
