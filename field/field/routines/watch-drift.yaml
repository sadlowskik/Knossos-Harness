id: watch-drift
name: Docs drift watch
enabled: false
trigger:
  kind: fs_change
  workspace: knossos
  paths: ["knossos-rs/src/**/*.rs"]
  debounce_seconds: 900
role: scout
endpoint: anthropic-haiku
thinking: low
workspace: knossos
orders: |
  Compare knossos-rs/README.md against the Rust sources that changed. Report only concrete
  drift: a documented behavior that the code no longer has. Cite file:line on both sides.
budget_usd: 0.50
completion:
  kind: report
