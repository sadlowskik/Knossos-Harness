id: nightly-verify
name: Nightly verification sweep
enabled: false
trigger:
  kind: schedule
  cron: "0 3 * * *"
role: verifier
endpoint: anthropic-opus
thinking: high
workspace: knossos
orders: |
  Run the full check suite for the Knossos workspace: cargo fmt --check, cargo clippy and
  cargo test in knossos-rs, then npm test in field. Report only what failed, with real output.
  Do not fix anything.
budget_usd: 2.00
completion:
  kind: report
  requires_verification: false
