name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build knossos
        working-directory: knossos-rs
        run: cargo build --release --locked --bin knossos
      - name: Package
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          python release/package.py \
            --binary knossos-rs/target/release/knossos.exe \
            --version "$ver" \
            --platform windows-x86_64 \
            --out dist
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: dist/*
          body: |
            Windows `knossos` CLI. Needs a model (Ollama, Anthropic, or a Cameo box).
            Beta. Not a certified release.

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build knossos
        working-directory: knossos-rs
        run: cargo build --release --locked --bin knossos
      - name: Package
        run: |
          ver="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          python3 release/package.py \
            --binary knossos-rs/target/release/knossos \
            --version "$ver" \
            --platform linux-x86_64 \
            --out dist
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: dist/*
