[pytest]
testpaths = tests
# The `knossos` package lives beside tests/; the `pytest` console script does not
# put the working directory on sys.path (python -m pytest does), so CI could not
# import it.
pythonpath = .
markers =
    slow: training-based checks (minutes, not seconds). Run with `pytest -m slow`.
addopts = -m "not slow"
