[package]
name = "daedalus-harness"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "An agentic coding harness shaped by the Daedalus architecture: exact symbol memory, tiered verification, and explicit halting around a swappable engine."
repository = "https://github.com/korbinsadlowski/daedalus-harness"
readme = "README.md"

[[bin]]
name = "daedalus"
path = "src/main.rs"

[lib]
name = "daedalus_harness"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.91"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.4", features = ["derive"] }
ignore = "0.4.31"
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "charset", "http2", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
similar = "3.1.1"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tree-sitter = "0.26.11"
tree-sitter-rust = "0.24.2"

[dev-dependencies]
tempfile = "3.27.0"
